name: Deploy the main branch
on:
  push:
    branches:
      - main
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd functions
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: |
        cd functions
        pytest test_chronomaps_api.py -v --cov=chronomaps_api --cov-report=term-missing

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'
    - name: Install Firebase CLI
      run: |
        npm install -g firebase-tools
    # - name: Authenticate to Firebase
    #   env:
    #     CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
    #   run: |
    #     echo $CREDENTIALS > $HOME/firebase-key.json
    #     export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
    #     cat $GOOGLE_APPLICATION_CREDENTIALS | head -n 4
    #     # firebase login:ci
    - name: Set up python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd functions
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        cd ..
    - name: Deploy to Firebase
      env:
        FIREBASE_PROJECT: chronomaps3
        CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      run: |
        echo $CREDENTIALS > $HOME/firebase-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
        # cat $GOOGLE_APPLICATION_CREDENTIALS | head -n 4
        firebase deploy --only functions --project $FIREBASE_PROJECT
